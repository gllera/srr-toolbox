# Shared uv project for every Python script in bin/ (and the tests): one place
# declaring the third-party deps, pinned by the committed uv.lock. The scripts'
# shebangs go through bin/srr-uvrun, which self-locates the repo and execs
# `uv run --project <repo> --script`, so any invocation — the shell, srr's
# fetch loop, the tests — resolves the same .venv from any cwd, wherever the
# checkout lives.
# No [build-system] on purpose: uv must install only the dependencies, never
# this repo itself as a package.
[project]
name = "srr-toolbox"
version = "2.0"
requires-python = ">=3.9"
dependencies = [
    "telethon>=1.43,<2",   # srr-telegram: MTProto account mode
    "cryptg>=0.4",         # srr-telegram: fast Telethon crypto
    "beautifulsoup4>=4.12", # srr-telegram web (no-auth) mode + srr-x: HTML parsing
    "httpx[http2]>=0.27",   # srr-x: feed fetch over HTTP/2 (nitter.poast.org 403s HTTP/1.1)
]
